<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostic du navigateur</title>
<!--
  Browser diagnostics, outside the app: no framework, no module, ES5 only, so that a browser on
  which the app does not run (the car's) still loads it. It reads the browser and its WebGL, shows
  the report and posts it to the server log (`POST /api/diag`, apps/server/src/http/diag.ts).
-->
<style>
  :root { --bg: #f5f5f5; --fg: #1b1b1b; --muted: #666; --line: #d6d6d6; --ok: #1e7d32; --ko: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #ececec; --muted: #9a9a9a; --line: #333; --ok: #7bc77f; --ko: #f2867d; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 18px/1.4 system-ui, sans-serif; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  h2 { font-size: 19px; margin: 24px 0 6px; }
  table { border-collapse: collapse; width: 100%; max-width: 960px; }
  td { border-top: 1px solid var(--line); padding: 4px 8px 4px 0; vertical-align: top; word-break: break-word; }
  td:first-child { color: var(--muted); width: 40%; }
  .ok { color: var(--ok); } .ko { color: var(--ko); }
  #status { margin: 8px 0; }
  button { font: inherit; padding: 6px 14px; margin: 0 8px 8px 0; }
  #frame { width: 100%; height: 70vh; border: 1px solid var(--line); display: none; }
  #trace { font: 15px/1.4 ui-monospace, monospace; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
</style>
</head>
<body>
<h1>Diagnostic du navigateur</h1>
<div id="status">Lecture…</div>
<button id="resend" type="button">Renvoyer au serveur</button>
<h2>Tests 3D</h2>
<p>Un test à la fois. Chaque étape part au journal du serveur : si l’onglet se ferme, recharger la page pour le suivant.</p>
<div id="tests"></div>
<div id="trace"></div>
<iframe id="frame" title="Test 3D"></iframe>
<div id="out"></div>
<script>
(function () {
  var statusEl = document.getElementById('status')
  var out = document.getElementById('out')
  var errors = []
  window.onerror = function (msg) { errors.push(String(msg)) }

  function attempt(fn) { try { return fn() } catch (e) { return 'erreur : ' + e } }

  /** Does this source PARSE? The app is built for es2022: a syntax refused here is a blank app. */
  function parses(src) { try { new Function(src); return true } catch (e) { return false } }

  function cssSupports(test) { return !!(window.CSS && CSS.supports && attempt(function () { return CSS.supports(test) }) === true) }

  var LIMITS = ['MAX_TEXTURE_SIZE', 'MAX_CUBE_MAP_TEXTURE_SIZE', 'MAX_RENDERBUFFER_SIZE', 'MAX_TEXTURE_IMAGE_UNITS',
    'MAX_COMBINED_TEXTURE_IMAGE_UNITS', 'MAX_VERTEX_TEXTURE_IMAGE_UNITS', 'MAX_VERTEX_UNIFORM_VECTORS',
    'MAX_FRAGMENT_UNIFORM_VECTORS', 'MAX_VARYING_VECTORS', 'MAX_VERTEX_ATTRIBS']
  var LIMITS2 = ['MAX_SAMPLES', 'MAX_3D_TEXTURE_SIZE', 'MAX_DRAW_BUFFERS', 'MAX_COLOR_ATTACHMENTS']

  function probe(kind, attrs) {
    var canvas = document.createElement('canvas')
    var gl = null
    try { gl = canvas.getContext(kind, attrs) } catch (e) { return { ok: false, error: String(e) } }
    if (!gl) return { ok: false }
    var r = { ok: true }
    var dbg = gl.getExtension('WEBGL_debug_renderer_info')
    r.vendor = gl.getParameter(dbg ? dbg.UNMASKED_VENDOR_WEBGL : gl.VENDOR)
    r.renderer = gl.getParameter(dbg ? dbg.UNMASKED_RENDERER_WEBGL : gl.RENDERER)
    r.version = gl.getParameter(gl.VERSION)
    r.glsl = gl.getParameter(gl.SHADING_LANGUAGE_VERSION)
    var names = kind === 'webgl2' ? LIMITS.concat(LIMITS2) : LIMITS
    for (var i = 0; i < names.length; i++) r[names[i]] = gl.getParameter(gl[names[i]])
    r.MAX_VIEWPORT_DIMS = Array.prototype.slice.call(gl.getParameter(gl.MAX_VIEWPORT_DIMS))
    var a = gl.getContextAttributes()
    r.antialias = a ? a.antialias : null
    r.extensions = gl.getSupportedExtensions()
    // Chromium keeps a limited number of live contexts: give this one back right away.
    var lose = gl.getExtension('WEBGL_lose_context')
    if (lose) lose.loseContext()
    return r
  }

  function collect() {
    var nav = navigator
    var perfMemory = window.performance && performance.memory
    return {
      navigateur: {
        userAgent: nav.userAgent,
        platform: nav.platform,
        language: nav.language,
        hardwareConcurrency: nav.hardwareConcurrency,
        deviceMemory: nav.deviceMemory === undefined ? null : nav.deviceMemory,
        jsHeapSizeLimitMo: perfMemory ? Math.round(perfMemory.jsHeapSizeLimit / 1048576) : null,
        maxTouchPoints: nav.maxTouchPoints,
        pointerCoarse: !!(window.matchMedia && matchMedia('(pointer: coarse)').matches),
        sombre: !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
      },
      ecran: {
        screen: screen.width + ' × ' + screen.height,
        fenetre: window.innerWidth + ' × ' + window.innerHeight,
        devicePixelRatio: window.devicePixelRatio,
        colorDepth: screen.colorDepth
      },
      webgl2: probe('webgl2'),
      webgl1: probe('webgl'),
      // false: the browser itself judges its GPU too slow (software rendering, blocklisted driver).
      webgl2SansAlerteDePerf: probe('webgl2', { failIfMajorPerformanceCaveat: true }).ok,
      javascript: {
        optionalChaining: parses('var a = {}; return a?.b ?? 1'),
        classFields: parses('class A { x = 1; static y = 2 }'),
        privateMethods: parses('class A { #x = 1; #m() { return this.#x } }'),
        staticBlocks: parses('class A { static { } }'),
        arrayAt: typeof [].at === 'function',
        objectHasOwn: typeof Object.hasOwn === 'function',
        structuredClone: typeof window.structuredClone === 'function',
        resizeObserver: typeof window.ResizeObserver === 'function',
        offscreenCanvas: typeof window.OffscreenCanvas === 'function'
      },
      css: {
        backdropFilter: cssSupports('backdrop-filter: blur(2px)'),
        containerQueries: cssSupports('container-type: inline-size'),
        has: cssSupports('selector(:has(a))'),
        colorMix: cssSupports('color: color-mix(in srgb, red, blue)'),
        aspectRatio: cssSupports('aspect-ratio: 1')
      },
      erreurs: errors
    }
  }

  function cell(value) {
    if (value === true) return '<span class="ok">oui</span>'
    if (value === false) return '<span class="ko">non</span>'
    if (value === null || value === undefined) return '—'
    if (Object.prototype.toString.call(value) === '[object Array]') return value.length ? escape(value.join(', ')) : '—'
    return escape(String(value))
  }

  function escape(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;') }

  function render(report) {
    var html = ''
    for (var section in report) {
      var v = report[section]
      html += '<h2>' + section + '</h2><table>'
      if (v !== null && typeof v === 'object' && Object.prototype.toString.call(v) !== '[object Array]') {
        for (var k in v) html += '<tr><td>' + k + '</td><td>' + cell(v[k]) + '</td></tr>'
      } else html += '<tr><td></td><td>' + cell(v) + '</td></tr>'
      html += '</table>'
    }
    out.innerHTML = html
  }

  function send(report) {
    statusEl.textContent = 'Envoi au serveur…'
    var xhr = new XMLHttpRequest()
    xhr.open('POST', '/api/diag')
    xhr.setRequestHeader('Content-Type', 'application/json')
    xhr.onload = function () {
      statusEl.innerHTML = xhr.status === 204
        ? '<span class="ok">Rapport inscrit dans le journal du serveur.</span>'
        : '<span class="ko">Le serveur a refusé le rapport (HTTP ' + xhr.status + ').</span>'
    }
    xhr.onerror = function () { statusEl.innerHTML = '<span class="ko">Serveur injoignable : le rapport n’est qu’à l’écran.</span>' }
    xhr.send(JSON.stringify(report))
  }

  // ---- 3D tests -------------------------------------------------------------------------------

  var traceEl = document.getElementById('trace')
  var frame = document.getElementById('frame')

  function traceLine(text) { traceEl.textContent += text + '\n'; traceEl.scrollTop = traceEl.scrollHeight }

  function beacon(payload) {
    var body = JSON.stringify(payload)
    if (navigator.sendBeacon && navigator.sendBeacon('/api/diag', new Blob([body], { type: 'application/json' }))) return
    var xhr = new XMLHttpRequest()
    xhr.open('POST', '/api/diag')
    xhr.setRequestHeader('Content-Type', 'application/json')
    xhr.send(body)
  }

  // The real scene of the app, with its switches (apps/web/src/lib/sceneProbe.ts). "low" for all:
  // that is what a weak machine gets in "auto", and the tests stay comparable from one machine to another.
  var SCENES = [
    { label: 'Scène telle quelle', query: 'probe=base' },
    { label: 'Sans ombres', query: 'probe=noshadows&shadows=0' },
    { label: 'Sans photos', query: 'probe=nophotos&assets=0' },
    { label: 'Sans ombres ni photos', query: 'probe=bare&shadows=0&assets=0' }
  ]

  function runScene(test) {
    stopRamp()
    traceEl.textContent = ''
    traceLine('— ' + test.label)
    frame.style.display = 'block'
    frame.src = '/?' + test.query + '&quality=low'
  }

  // What the scene in the frame reports (`sceneProbe.ts` posts each step to its parent as well).
  window.addEventListener('message', function (e) {
    var p = e.origin === location.origin && e.data && e.data.kasbahProbe
    if (!p) return
    var s = p.stats || {}
    var line = (p.t / 1000).toFixed(1) + ' s · ' + p.step
    if (p.progress) line += ' ' + p.progress.done + '/' + p.progress.total
    if (p.heapMo !== null) line += ' · tas ' + p.heapMo + ' Mo'
    if (s.fps !== undefined) line += ' · ' + s.fps + ' img/s, ' + s.cpuMs + ' ms CPU, ' + s.textures + ' textures, ' + s.programs + ' programmes'
    if (p.message) line += ' · ' + p.message
    if (p.why) line += ' (' + p.why + ')'
    traceLine(line)
  })

  // GPU memory ramp: textures of 4 MB uploaded until the browser refuses or drops the context.
  // Tells the GPU memory ceiling, to compare with what the scene uploads.
  var RAMP_STEP_MO = 32, RAMP_MAX_MO = 1024, TEXTURE_MO = 4
  var ramp = null

  function stopRamp() { if (ramp) { clearTimeout(ramp.timer); ramp.lose && ramp.lose.loseContext(); ramp = null } }

  function runRamp() {
    stopRamp()
    frame.style.display = 'none'
    frame.src = 'about:blank'
    traceEl.textContent = ''
    traceLine('— Rampe mémoire GPU')
    var run = Math.random().toString(36).slice(2, 8)
    var canvas = document.createElement('canvas')
    var gl = canvas.getContext('webgl2') || canvas.getContext('webgl')
    if (!gl) { traceLine('pas de WebGL'); return }
    var lost = false
    canvas.addEventListener('webglcontextlost', function () { lost = true })
    var size = 1024, pixels = new Uint8Array(size * size * 4)
    for (var i = 0; i < pixels.length; i++) pixels[i] = i & 255
    var textures = []
    var t0 = Date.now()
    ramp = { lose: gl.getExtension('WEBGL_lose_context'), timer: 0 }
    function report(step, mo, extra) {
      var payload = { ramp: { run: run, step: step, mo: mo, t: Date.now() - t0 } }
      if (extra) payload.ramp.error = extra
      beacon(payload)
      traceLine(((Date.now() - t0) / 1000).toFixed(1) + ' s · ' + step + ' · ' + mo + ' Mo' + (extra ? ' · ' + extra : ''))
    }
    report('start', 0)
    function next() {
      for (var k = 0; k < RAMP_STEP_MO / TEXTURE_MO; k++) {
        var tex = gl.createTexture()
        gl.bindTexture(gl.TEXTURE_2D, tex)
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, size, size, 0, gl.RGBA, gl.UNSIGNED_BYTE, pixels)
        textures.push(tex)
      }
      // a draw-free flush is not enough everywhere: `finish` makes the driver commit the uploads
      gl.finish()
      var mo = textures.length * TEXTURE_MO
      var err = gl.getError()
      if (lost || gl.isContextLost()) { report('contextlost', mo); ramp = null; return }
      if (err !== gl.NO_ERROR) { report('refused', mo, 'erreur GL ' + err); stopRamp(); return }
      report('ok', mo)
      if (mo >= RAMP_MAX_MO) { report('end', mo, 'plafond du test atteint'); stopRamp(); return }
      ramp.timer = setTimeout(next, 250)
    }
    ramp.timer = setTimeout(next, 250)
  }

  var testsEl = document.getElementById('tests')
  function addButton(label, onclick) {
    var b = document.createElement('button')
    b.type = 'button'
    b.textContent = label
    b.onclick = onclick
    testsEl.appendChild(b)
  }
  for (var s = 0; s < SCENES.length; s++) addButton(SCENES[s].label, (function (test) { return function () { runScene(test) } })(SCENES[s]))
  addButton('Rampe mémoire GPU', runRamp)

  var report = attempt(collect)
  if (typeof report === 'string') { statusEl.innerHTML = '<span class="ko">' + escape(report) + '</span>'; return }
  render(report)
  send(report)
  document.getElementById('resend').onclick = function () { send(report) }
})()
</script>
</body>
</html>
