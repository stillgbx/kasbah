# Publishes site/ (the showcase site) and, under demo/, the web app built on its in-process simulation
# (`npm run build:demo -w @kasbah/web`), to GitHub Pages. Pages must be set to "GitHub Actions" in the
# repository's settings (Settings → Pages → Source).
#
# The build runs third-party code (npm packages): it gets a read-only token and no install scripts.
# Only the deploy job, which runs no code from the repository or from npm, may write to Pages.
# Actions are pinned to a commit: a moved tag cannot change what runs here.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'packages/mock-sim/**'
      - 'house/demos/**'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run build:demo -w @kasbah/web
      - name: Assemble the site and the demo
        run: |
          mkdir _site
          cp -R site/. _site/
          cp -R apps/web/dist-demo _site/demo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
