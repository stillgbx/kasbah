# Publishes site/ (the showcase site) and, under demo/, the web app built on its in-process simulation
# (`npm run build:demo -w @kasbah/web`), to GitHub Pages. Pages must be set to "GitHub Actions" in the
# repository's settings (Settings → Pages → Source).
#
# The build runs third-party code (npm packages): it gets a read-only token and no install scripts.
# Only the deploy job, which runs no code from the repository or from npm, may write to Pages.
# Actions are pinned to a commit: a moved tag cannot change what runs here.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'packages/mock-sim/**'
      - 'house/demos/**'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run build:demo -w @kasbah/web
      - name: Assemble the site and the demo
        run: |
          mkdir _site
          cp -R site/. _site/
          cp -R apps/web/dist-demo _site/demo
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
