<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Kasbah</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d1420">
  <!-- Pages serves this file for any missing address, at that address: links are absolute. -->
  <link rel="icon" href="/kasbah/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/kasbah/style.css">
  <script>
    // A page of the demo reloaded or shared (/kasbah/demo/weather): Pages only has the demo's
    // index.html, so the demo opens on its home screen.
    if (location.pathname.indexOf('/kasbah/demo/') === 0) location.replace('/kasbah/demo/')
  </script>
</head>
<body>
<main class="doc">
  <h1>Page not found</h1>
  <p>This page does not exist. <a href="/kasbah/">Back to Kasbah</a></p>
  <p lang="fr">Cette page n'existe pas. <a href="/kasbah/fr/">Retour à Kasbah</a></p>
</main>
</body>
</html>
